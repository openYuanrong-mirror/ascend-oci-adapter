name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: cmd/ascend-oci-adapter/go.sum
      - name: Test
        run: make test
      - name: Vet
        run: make vet
      - name: Build amd64
        run: make build
